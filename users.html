<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理 - 考勤管理系统</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- 侧边导航栏 -->
        <nav class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fas fa-clock"></i>
                    <span>考勤系统</span>
                </div>
            </div>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="index.html">
                        <i class="fas fa-fingerprint"></i>
                        <span>打卡签到</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="leave.html">
                        <i class="fas fa-calendar-alt"></i>
                        <span>请假申请</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="history.html">
                        <i class="fas fa-history"></i>
                        <span>打卡记录</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="approval.html">
                        <i class="fas fa-check-circle"></i>
                        <span>审批管理</span>
                    </a>
                </li>
                <li class="nav-item active">
                    <a href="users.html">
                        <i class="fas fa-users"></i>
                        <span>用户管理</span>
                    </a>
                </li>
            </ul>
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar">
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="user-details">
                        <p class="user-name" id="currentUserName">加载中...</p>
                        <p class="user-role" id="currentUserRole">加载中...</p>
                    </div>
                </div>
                <button class="logout-btn" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>退出登录</span>
                </button>
            </div>
        </nav>

        <!-- 主内容区域 -->
        <main class="main-content">
            <header class="top-header">
                <h1 class="page-title">用户管理</h1>
                <div class="header-actions">
                    <div class="current-time" id="currentTime"></div>
                </div>
            </header>

            <div class="content-wrapper">
                <!-- 统计卡片 -->
                <div class="stats-cards">
                    <div class="stat-card">
                        <div class="stat-icon blue">
                            <i class="fas fa-users"></i>
                        </div>
                        <div class="stat-info">
                            <h3 id="totalUsers">0</h3>
                            <p>总用户数</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon green">
                            <i class="fas fa-user-check"></i>
                        </div>
                        <div class="stat-info">
                            <h3 id="activeUsers">0</h3>
                            <p>在职员工</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon orange">
                            <i class="fas fa-user-shield"></i>
                        </div>
                        <div class="stat-info">
                            <h3 id="adminUsers">0</h3>
                            <p>管理员</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon purple">
                            <i class="fas fa-building"></i>
                        </div>
                        <div class="stat-info">
                            <h3 id="totalDepartments">0</h3>
                            <p>部门数量</p>
                        </div>
                    </div>
                </div>

                <!-- 用户列表卡片 -->
                <div class="card">
                    <div class="card-header">
                        <h2>用户列表</h2>
                        <div class="card-actions">
                            <div class="search-box">
                                <i class="fas fa-search"></i>
                                <input type="text" id="searchInput" placeholder="搜索用户名、姓名或部门...">
                            </div>
                            <select id="filterDepartment" class="filter-select">
                                <option value="">全部部门</option>
                                <option value="技术部">技术部</option>
                                <option value="产品部">产品部</option>
                                <option value="市场部">市场部</option>
                                <option value="销售部">销售部</option>
                                <option value="人事部">人事部</option>
                                <option value="财务部">财务部</option>
                                <option value="运营部">运营部</option>
                            </select>
                            <select id="filterStatus" class="filter-select">
                                <option value="">全部状态</option>
                                <option value="active">在职</option>
                                <option value="inactive">离职</option>
                            </select>
                            <button class="btn btn-primary" onclick="openAddModal()">
                                <i class="fas fa-plus"></i>
                                新增用户
                            </button>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="data-table" id="usersTable">
                                <thead>
                                    <tr>
                                        <th>
                                            <input type="checkbox" id="selectAll">
                                        </th>
                                        <th>用户信息</th>
                                        <th>部门/职位</th>
                                        <th>联系方式</th>
                                        <th>角色</th>
                                        <th>状态</th>
                                        <th>创建时间</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody id="usersTableBody">
                                    <!-- 动态生成 -->
                                </tbody>
                            </table>
                        </div>
                        <div class="table-footer">
                            <div class="pagination-info">
                                共 <span id="totalCount">0</span> 条记录
                            </div>
                            <div class="pagination" id="pagination">
                                <!-- 动态生成 -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 新增/编辑用户模态框 -->
    <div class="modal" id="userModal">
        <div class="modal-overlay" onclick="closeModal()"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">新增用户</h3>
                <button class="modal-close" onclick="closeModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form class="modal-body" id="userForm">
                <input type="hidden" id="editUserId">
                <div class="form-row">
                    <div class="form-group">
                        <label for="modalUsername">用户名 <span class="required">*</span></label>
                        <input type="text" id="modalUsername" required>
                    </div>
                    <div class="form-group">
                        <label for="modalName">真实姓名 <span class="required">*</span></label>
                        <input type="text" id="modalName" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="modalDepartment">部门 <span class="required">*</span></label>
                        <select id="modalDepartment" required>
                            <option value="">请选择</option>
                            <option value="技术部">技术部</option>
                            <option value="产品部">产品部</option>
                            <option value="市场部">市场部</option>
                            <option value="销售部">销售部</option>
                            <option value="人事部">人事部</option>
                            <option value="财务部">财务部</option>
                            <option value="运营部">运营部</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="modalPosition">职位 <span class="required">*</span></label>
                        <input type="text" id="modalPosition" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="modalEmail">邮箱 <span class="required">*</span></label>
                        <input type="email" id="modalEmail" required>
                    </div>
                    <div class="form-group">
                        <label for="modalPhone">手机号 <span class="required">*</span></label>
                        <input type="tel" id="modalPhone" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="modalRole">角色 <span class="required">*</span></label>
                        <select id="modalRole" required>
                            <option value="employee">普通员工</option>
                            <option value="manager">部门经理</option>
                            <option value="admin">管理员</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="modalStatus">状态 <span class="required">*</span></label>
                        <select id="modalStatus" required>
                            <option value="active">在职</option>
                            <option value="inactive">离职</option>
                        </select>
                    </div>
                </div>
                <div class="form-group" id="passwordGroup">
                    <label for="modalPassword">密码 <span class="required">*</span></label>
                    <div class="password-input">
                        <input type="password" id="modalPassword" placeholder="至少6位字符">
                        <button type="button" class="toggle-password" onclick="toggleModalPassword()">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
            </form>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeModal()">取消</button>
                <button type="button" class="btn btn-primary" onclick="saveUser()">保存</button>
            </div>
        </div>
    </div>

    <!-- 删除确认模态框 -->
    <div class="modal" id="deleteModal">
        <div class="modal-overlay" onclick="closeDeleteModal()"></div>
        <div class="modal-content modal-small">
            <div class="modal-header">
                <h3>确认删除</h3>
                <button class="modal-close" onclick="closeDeleteModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="confirm-message">
                    <i class="fas fa-exclamation-triangle"></i>
                    <p>确定要删除用户 <strong id="deleteUserName"></strong> 吗？<br>此操作不可恢复。</p>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeDeleteModal()">取消</button>
                <button type="button" class="btn btn-danger" onclick="confirmDelete()">删除</button>
            </div>
        </div>
    </div>

    <script>
        // 全局变量
        let users = [];
        let currentPage = 1;
        const pageSize = 10;
        let deleteUserId = null;

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            checkLoginStatus();
            initCurrentTime();
            loadUsers();
            initEventListeners();
        });

        // 检查登录状态
        function checkLoginStatus() {
            const currentUser = JSON.parse(localStorage.getItem('attendance_current_user'));
            if (!currentUser) {
                window.location.href = 'login.html';
                return;
            }
            
            // 更新侧边栏用户信息
            document.getElementById('currentUserName').textContent = currentUser.name || currentUser.username;
            document.getElementById('currentUserRole').textContent = (currentUser.department || '') + ' - ' + (currentUser.position || getRoleText(currentUser.role));
        }

        // 获取角色文本
        function getRoleText(role) {
            const roleMap = {
                'admin': '管理员',
                'manager': '部门经理',
                'employee': '普通员工'
            };
            return roleMap[role] || role;
        }

        // 初始化当前时间显示
        function initCurrentTime() {
            const timeElement = document.getElementById('currentTime');
            if (timeElement) {
                updateTime();
                setInterval(updateTime, 1000);
            }
        }

        function updateTime() {
            const now = new Date();
            const timeString = now.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            });
            const element = document.getElementById('currentTime');
            if (element) {
                element.textContent = timeString;
            }
        }

        // 加载用户数据
        function loadUsers() {
            users = JSON.parse(localStorage.getItem('attendance_users') || '[]');
            
            // 如果没有数据，添加一些示例数据
            if (users.length === 0) {
                users = [
                    {
                        id: 'user_1',
                        username: 'zhangsan',
                        name: '张三',
                        department: '技术部',
                        position: '工程师',
                        email: 'zhangsan@company.com',
                        phone: '13800138001',
                        role: 'employee',
                        status: 'active',
                        createTime: '2024-01-15T08:00:00.000Z'
                    },
                    {
                        id: 'user_2',
                        username: 'lisi',
                        name: '李四',
                        department: '产品部',
                        position: '产品经理',
                        email: 'lisi@company.com',
                        phone: '13800138002',
                        role: 'manager',
                        status: 'active',
                        createTime: '2024-01-10T08:00:00.000Z'
                    },
                    {
                        id: 'user_3',
                        username: 'wangwu',
                        name: '王五',
                        department: '市场部',
                        position: '市场专员',
                        email: 'wangwu@company.com',
                        phone: '13800138003',
                        role: 'employee',
                        status: 'inactive',
                        createTime: '2024-01-05T08:00:00.000Z'
                    }
                ];
                localStorage.setItem('attendance_users', JSON.stringify(users));
            }
            
            updateStats();
            renderTable();
        }

        // 更新统计数据
        function updateStats() {
            document.getElementById('totalUsers').textContent = users.length;
            document.getElementById('activeUsers').textContent = users.filter(u => u.status === 'active').length;
            document.getElementById('adminUsers').textContent = users.filter(u => u.role === 'admin').length;
            
            const departments = [...new Set(users.map(u => u.department))].filter(d => d);
            document.getElementById('totalDepartments').textContent = departments.length;
        }

        // 渲染表格
        function renderTable() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filterDepartment = document.getElementById('filterDepartment').value;
            const filterStatus = document.getElementById('filterStatus').value;
            
            let filteredUsers = users.filter(user => {
                const matchSearch = !searchTerm || 
                    user.username.toLowerCase().includes(searchTerm) ||
                    user.name.toLowerCase().includes(searchTerm) ||
                    (user.department && user.department.toLowerCase().includes(searchTerm));
                
                const matchDepartment = !filterDepartment || user.department === filterDepartment;
                const matchStatus = !filterStatus || user.status === filterStatus;
                
                return matchSearch && matchDepartment && matchStatus;
            });
            
            // 分页
            const totalCount = filteredUsers.length;
            const totalPages = Math.ceil(totalCount / pageSize);
            const start = (currentPage - 1) * pageSize;
            const end = start + pageSize;
            const pageUsers = filteredUsers.slice(start, end);
            
            // 渲染表格内容
            const tbody = document.getElementById('usersTableBody');
            tbody.innerHTML = pageUsers.map(user => `
                <tr>
                    <td>
                        <input type="checkbox" class="user-checkbox" value="${user.id}">
                    </td>
                    <td>
                        <div class="user-cell">
                            <div class="user-avatar-small">
                                <i class="fas fa-user"></i>
                            </div>
                            <div class="user-info">
                                <div class="user-name">${user.name}</div>
                                <div class="user-username">@${user.username}</div>
                            </div>
                        </div>
                    </td>
                    <td>
                        <div class="dept-position">
                            <div class="department">${user.department || '-'}</div>
                            <div class="position">${user.position || '-'}</div>
                        </div>
                    </td>
                    <td>
                        <div class="contact-info">
                            <div><i class="fas fa-envelope"></i> ${user.email}</div>
                            <div><i class="fas fa-phone"></i> ${user.phone}</div>
                        </div>
                    </td>
                    <td>
                        <span class="role-badge ${user.role}">${getRoleText(user.role)}</span>
                    </td>
                    <td>
                        <span class="status-badge ${user.status}">
                            ${user.status === 'active' ? '在职' : '离职'}
                        </span>
                    </td>
                    <td>${formatDate(user.createTime)}</td>
                    <td>
                        <div class="action-btns">
                            <button class="action-btn edit" onclick="openEditModal('${user.id}')" title="编辑">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="action-btn delete" onclick="openDeleteModal('${user.id}')" title="删除">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');
            
            document.getElementById('totalCount').textContent = totalCount;
            renderPagination(totalPages, totalCount);
        }

        // 渲染分页
        function renderPagination(totalPages, totalCount) {
            const pagination = document.getElementById('pagination');
            
            if (totalPages <= 1) {
                pagination.innerHTML = '';
                return;
            }
            
            let html = '';
            
            // 上一页
            html += `<button class="page-btn ${currentPage === 1 ? 'disabled' : ''}" onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>
                <i class="fas fa-chevron-left"></i>
            </button>`;
            
            // 页码
            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
                    html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
                } else if (i === currentPage - 2 || i === currentPage + 2) {
                    html += `<span class="page-ellipsis">...</span>`;
                }
            }
            
            // 下一页
            html += `<button class="page-btn ${currentPage === totalPages ? 'disabled' : ''}" onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>
                <i class="fas fa-chevron-right"></i>
            </button>`;
            
            pagination.innerHTML = html;
        }

        // 切换页面
        function changePage(page) {
            currentPage = page;
            renderTable();
        }

        // 格式化日期
        function formatDate(dateString) {
            if (!dateString) return '-';
            const date = new Date(dateString);
            return date.toLocaleDateString('zh-CN');
        }

        // 初始化事件监听
        function initEventListeners() {
            // 搜索
            document.getElementById('searchInput').addEventListener('input', function() {
                currentPage = 1;
                renderTable();
            });
            
            // 部门筛选
            document.getElementById('filterDepartment').addEventListener('change', function() {
                currentPage = 1;
                renderTable();
            });
            
            // 状态筛选
            document.getElementById('filterStatus').addEventListener('change', function() {
                currentPage = 1;
                renderTable();
            });
            
            // 全选
            document.getElementById('selectAll').addEventListener('change', function() {
                const checkboxes = document.querySelectorAll('.user-checkbox');
                checkboxes.forEach(cb => cb.checked = this.checked);
            });
        }

        // 打开新增模态框
        function openAddModal() {
            document.getElementById('modalTitle').textContent = '新增用户';
            document.getElementById('userForm').reset();
            document.getElementById('editUserId').value = '';
            document.getElementById('passwordGroup').style.display = 'block';
            document.getElementById('modalPassword').required = true;
            document.getElementById('modalUsername').disabled = false;
            
            document.getElementById('userModal').classList.add('show');
        }

        // 打开编辑模态框
        function openEditModal(userId) {
            const user = users.find(u => u.id === userId);
            if (!user) return;
            
            document.getElementById('modalTitle').textContent = '编辑用户';
            document.getElementById('editUserId').value = user.id;
            document.getElementById('modalUsername').value = user.username;
            document.getElementById('modalUsername').disabled = true;
            document.getElementById('modalName').value = user.name;
            document.getElementById('modalDepartment').value = user.department;
            document.getElementById('modalPosition').value = user.position;
            document.getElementById('modalEmail').value = user.email;
            document.getElementById('modalPhone').value = user.phone;
            document.getElementById('modalRole').value = user.role;
            document.getElementById('modalStatus').value = user.status;
            document.getElementById('modalPassword').value = '';
            document.getElementById('passwordGroup').style.display = 'none';
            document.getElementById('modalPassword').required = false;
            
            document.getElementById('userModal').classList.add('show');
        }

        // 关闭模态框
        function closeModal() {
            document.getElementById('userModal').classList.remove('show');
        }

        // 切换密码显示
        function toggleModalPassword() {
            const input = document.getElementById('modalPassword');
            const icon = event.currentTarget.querySelector('i');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        // 保存用户
        function saveUser() {
            const form = document.getElementById('userForm');
            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }
            
            const userId = document.getElementById('editUserId').value;
            const username = document.getElementById('modalUsername').value.trim();
            const name = document.getElementById('modalName').value.trim();
            const department = document.getElementById('modalDepartment').value;
            const position = document.getElementById('modalPosition').value.trim();
            const email = document.getElementById('modalEmail').value.trim();
            const phone = document.getElementById('modalPhone').value.trim();
            const role = document.getElementById('modalRole').value;
            const status = document.getElementById('modalStatus').value;
            const password = document.getElementById('modalPassword').value;
            
            // 验证邮箱
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showMessage('请输入正确的邮箱地址！', 'error');
                return;
            }
            
            // 验证手机号
            const phoneRegex = /^1[3-9]\d{9}$/;
            if (!phoneRegex.test(phone)) {
                showMessage('请输入正确的手机号！', 'error');
                return;
            }
            
            if (userId) {
                // 编辑用户
                const index = users.findIndex(u => u.id === userId);
                if (index !== -1) {
                    users[index] = {
                        ...users[index],
                        name,
                        department,
                        position,
                        email,
                        phone,
                        role,
                        status
                    };
                    showMessage('用户更新成功！', 'success');
                }
            } else {
                // 新增用户
                if (users.find(u => u.username === username)) {
                    showMessage('用户名已存在！', 'error');
                    return;
                }
                
                if (password.length < 6) {
                    showMessage('密码长度至少为6位！', 'error');
                    return;
                }
                
                const newUser = {
                    id: 'user_' + Date.now(),
                    username,
                    name,
                    department,
                    position,
                    email,
                    phone,
                    role,
                    status,
                    password,
                    createTime: new Date().toISOString()
                };
                users.push(newUser);
                showMessage('用户创建成功！', 'success');
            }
            
            localStorage.setItem('attendance_users', JSON.stringify(users));
            closeModal();
            updateStats();
            renderTable();
        }

        // 打开删除确认模态框
        function openDeleteModal(userId) {
            const user = users.find(u => u.id === userId);
            if (!user) return;
            
            deleteUserId = userId;
            document.getElementById('deleteUserName').textContent = user.name;
            document.getElementById('deleteModal').classList.add('show');
        }

        // 关闭删除确认模态框
        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.remove('show');
            deleteUserId = null;
        }

        // 确认删除
        function confirmDelete() {
            if (!deleteUserId) return;
            
            users = users.filter(u => u.id !== deleteUserId);
            localStorage.setItem('attendance_users', JSON.stringify(users));
            
            showMessage('用户删除成功！', 'success');
            closeDeleteModal();
            updateStats();
            renderTable();
        }

        // 退出登录
        function logout() {
            localStorage.removeItem('attendance_current_user');
            window.location.href = 'login.html';
        }

        // 显示消息提示
        function showMessage(message, type) {
            const existingMessage = document.querySelector('.message-toast');
            if (existingMessage) {
                existingMessage.remove();
            }
            
            const toast = document.createElement('div');
            toast.className = `message-toast ${type}`;
            toast.innerHTML = `
                <i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i>
                <span>${message}</span>
            `;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.add('show');
            }, 10);
            
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
    </script>
</body>
</html>
