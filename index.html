<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>考勤管理系统</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- 侧边导航栏 -->
        <nav class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fas fa-clock"></i>
                    <span>考勤系统</span>
                </div>
            </div>
            <ul class="nav-menu">
                <li class="nav-item active">
                    <a href="index.html">
                        <i class="fas fa-fingerprint"></i>
                        <span>打卡签到</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="leave.html">
                        <i class="fas fa-calendar-alt"></i>
                        <span>请假申请</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="history.html">
                        <i class="fas fa-history"></i>
                        <span>打卡记录</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="approval.html">
                        <i class="fas fa-check-circle"></i>
                        <span>审批管理</span>
                    </a>
                </li>
            </ul>
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar">
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="user-details">
                        <p class="user-name">张三</p>
                        <p class="user-role">技术部 - 工程师</p>
                    </div>
                </div>
            </div>
        </nav>

        <!-- 主内容区域 -->
        <main class="main-content">
            <header class="top-header">
                <h1 class="page-title">打卡签到</h1>
                <div class="header-actions">
                    <div class="current-time" id="currentTime"></div>
                </div>
            </header>

            <div class="content-wrapper">
                <!-- 打卡状态卡片 -->
                <div class="checkin-status-card">
                    <div class="status-header">
                        <h2>今日考勤状态</h2>
                        <span class="status-badge" id="todayStatus">未打卡</span>
                    </div>
                    <div class="status-body">
                        <div class="time-display">
                            <div class="time-item">
                                <label>上班时间</label>
                                <div class="time-value" id="checkInTime">--:--</div>
                            </div>
                            <div class="time-divider"></div>
                            <div class="time-item">
                                <label>下班时间</label>
                                <div class="time-value" id="checkOutTime">--:--</div>
                            </div>
                            <div class="time-divider"></div>
                            <div class="time-item">
                                <label>工作时长</label>
                                <div class="time-value" id="workDuration">--</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 打卡方式选择 -->
                <div class="checkin-methods">
                    <h3>选择打卡方式</h3>
                    <div class="methods-grid">
                        <button class="method-btn active" data-method="face">
                            <i class="fas fa-user-circle"></i>
                            <span>人脸识别</span>
                        </button>
                        <button class="method-btn" data-method="fingerprint">
                            <i class="fas fa-fingerprint"></i>
                            <span>指纹识别</span>
                        </button>
                        <button class="method-btn" data-method="qrcode">
                            <i class="fas fa-qrcode"></i>
                            <span>二维码</span>
                        </button>
                        <button class="method-btn" data-method="gps">
                            <i class="fas fa-map-marker-alt"></i>
                            <span>GPS定位</span>
                        </button>
                    </div>
                </div>

                <!-- 打卡操作区域 -->
                <div class="checkin-action">
                    <div class="checkin-visual" id="checkinVisual">
                        <div class="pulse-ring"></div>
                        <div class="pulse-ring"></div>
                        <div class="pulse-ring"></div>
                        <button class="checkin-btn" id="checkinBtn">
                            <i class="fas fa-fingerprint"></i>
                            <span>上班打卡</span>
                        </button>
                    </div>
                    <p class="location-info">
                        <i class="fas fa-map-marker-alt"></i>
                        <span id="locationText">正在获取位置...</span>
                    </p>
                </div>

                <!-- 打卡统计 -->
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon normal">
                            <i class="fas fa-check"></i>
                        </div>
                        <div class="stat-info">
                            <span class="stat-value" id="normalDays">18</span>
                            <span class="stat-label">正常出勤</span>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon late">
                            <i class="fas fa-clock"></i>
                        </div>
                        <div class="stat-info">
                            <span class="stat-value" id="lateDays">2</span>
                            <span class="stat-label">迟到</span>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon early">
                            <i class="fas fa-walking"></i>
                        </div>
                        <div class="stat-info">
                            <span class="stat-value" id="earlyDays">1</span>
                            <span class="stat-label">早退</span>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon absent">
                            <i class="fas fa-times"></i>
                        </div>
                        <div class="stat-info">
                            <span class="stat-value" id="absentDays">0</span>
                            <span class="stat-label">缺勤</span>
                        </div>
                    </div>
                </div>

                <!-- 异常打卡处理 -->
                <div class="exception-section">
                    <h3>异常打卡申请</h3>
                    <div class="exception-list">
                        <div class="exception-item">
                            <div class="exception-info">
                                <span class="exception-type">补卡申请</span>
                                <span class="exception-date">2024-03-15</span>
                                <span class="exception-status pending">待审批</span>
                            </div>
                            <button class="btn-text">查看详情</button>
                        </div>
                    </div>
                    <button class="btn-secondary" onclick="showExceptionModal()">
                        <i class="fas fa-plus"></i>
                        提交异常申请
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- 异常申请弹窗 -->
    <div class="modal" id="exceptionModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>异常打卡申请</h3>
                <button class="close-btn" onclick="closeExceptionModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <form id="exceptionForm">
                    <div class="form-group">
                        <label>申请类型</label>
                        <select class="form-control" id="exceptionType">
                            <option value="forget">忘记打卡</option>
                            <option value="late">迟到说明</option>
                            <option value="early">早退说明</option>
                            <option value="other">其他</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>日期</label>
                        <input type="date" class="form-control" id="exceptionDate">
                    </div>
                    <div class="form-group">
                        <label>时间</label>
                        <input type="time" class="form-control" id="exceptionTime">
                    </div>
                    <div class="form-group">
                        <label>说明原因</label>
                        <textarea class="form-control" rows="3" placeholder="请详细说明原因..."></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeExceptionModal()">取消</button>
                <button class="btn-primary" onclick="submitException()">提交申请</button>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
