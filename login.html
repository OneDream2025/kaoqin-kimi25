<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 考勤管理系统</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }
        
        .login-box {
            background: var(--white);
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 420px;
            padding: 40px;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }
        
        .login-logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-light));
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }
        
        .login-logo i {
            font-size: 40px;
            color: var(--white);
        }
        
        .login-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--gray-800);
            margin-bottom: 8px;
        }
        
        .login-subtitle {
            font-size: 14px;
            color: var(--gray-500);
        }
        
        .login-form .form-group {
            margin-bottom: 20px;
        }
        
        .login-form .form-control {
            padding: 14px 16px;
            font-size: 15px;
        }
        
        .input-icon-wrapper {
            position: relative;
        }
        
        .input-icon-wrapper i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray-400);
            font-size: 16px;
        }
        
        .input-icon-wrapper .form-control {
            padding-left: 44px;
        }
        
        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        
        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 14px;
            color: var(--gray-600);
        }
        
        .remember-me input {
            width: 16px;
            height: 16px;
            accent-color: var(--primary-color);
        }
        
        .forgot-password {
            font-size: 14px;
            color: var(--primary-color);
            text-decoration: none;
        }
        
        .forgot-password:hover {
            text-decoration: underline;
        }
        
        .login-btn {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
        }
        
        .login-footer {
            text-align: center;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid var(--gray-200);
        }
        
        .login-footer p {
            font-size: 13px;
            color: var(--gray-500);
        }
        
        .demo-accounts {
            margin-top: 24px;
            padding: 16px;
            background: var(--gray-50);
            border-radius: 8px;
        }
        
        .demo-accounts h4 {
            font-size: 13px;
            color: var(--gray-600);
            margin-bottom: 12px;
        }
        
        .demo-account-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid var(--gray-200);
        }
        
        .demo-account-item:last-child {
            border-bottom: none;
        }
        
        .demo-account-item span {
            font-size: 13px;
            color: var(--gray-600);
        }
        
        .demo-account-item code {
            font-size: 12px;
            background: var(--gray-200);
            padding: 2px 8px;
            border-radius: 4px;
        }
        
        .password-toggle {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--gray-400);
            cursor: pointer;
            padding: 4px;
        }
        
        .password-toggle:hover {
            color: var(--gray-600);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <div class="login-logo">
                    <i class="fas fa-clock"></i>
                </div>
                <h1 class="login-title">考勤管理系统</h1>
                <p class="login-subtitle">请登录您的账号</p>
            </div>
            
            <form class="login-form" id="loginForm" onsubmit="return handleLogin(event)">
                <div class="form-group">
                    <label>用户名</label>
                    <div class="input-icon-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" class="form-control" id="username" placeholder="请输入用户名" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>密码</label>
                    <div class="input-icon-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" class="form-control" id="password" placeholder="请输入密码" required>
                        <button type="button" class="password-toggle" onclick="togglePassword()">
                            <i class="fas fa-eye" id="passwordToggleIcon"></i>
                        </button>
                    </div>
                </div>
                
                <div class="remember-forgot">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe">
                        <span>记住我</span>
                    </label>
                    <a href="#" class="forgot-password">忘记密码？</a>
                </div>
                
                <button type="submit" class="btn-primary login-btn">
                    <i class="fas fa-sign-in-alt"></i>
                    登录
                </button>
            </form>
            
            <div class="demo-accounts">
                <h4><i class="fas fa-info-circle"></i> 演示账号</h4>
                <div class="demo-account-item">
                    <span>普通员工</span>
                    <div>
                        <code>zhangsan</code> / <code>123456</code>
                    </div>
                </div>
                <div class="demo-account-item">
                    <span>部门经理</span>
                    <div>
                        <code>limanager</code> / <code>123456</code>
                    </div>
                </div>
            </div>
            
            <div class="login-footer">
                <p>© 2024 考勤管理系统 版权所有</p>
            </div>
        </div>
    </div>
    
    <script src="js/main.js"></script>
    <script>
        function handleLogin(event) {
            event.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            
            const users = {
                'zhangsan': {
                    password: '123456',
                    name: '张三',
                    role: '技术部 - 工程师',
                    avatar: '张'
                },
                'limanager': {
                    password: '123456',
                    name: '李经理',
                    role: '技术部 - 经理',
                    avatar: '李'
                }
            };
            
            if (users[username] && users[username].password === password) {
                const user = {
                    username: username,
                    name: users[username].name,
                    role: users[username].role,
                    avatar: users[username].avatar,
                    loginTime: new Date().toISOString()
                };
                
                if (rememberMe) {
                    localStorage.setItem('currentUser', JSON.stringify(user));
                } else {
                    sessionStorage.setItem('currentUser', JSON.stringify(user));
                }
                
                showNotification('登录成功，正在跳转...', 'success');
                
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);
            } else {
                showNotification('用户名或密码错误！', 'error');
            }
            
            return false;
        }
        
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('passwordToggleIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.className = 'fas fa-eye-slash';
            } else {
                passwordInput.type = 'password';
                toggleIcon.className = 'fas fa-eye';
            }
        }
    </script>
</body>
</html>
