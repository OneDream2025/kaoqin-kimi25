<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 考勤管理系统</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="fas fa-clock"></i>
                </div>
                <h1>考勤管理系统</h1>
                <p>企业员工考勤管理平台</p>
            </div>
            
            <form class="auth-form" id="loginForm">
                <div class="form-group">
                    <label for="username">
                        <i class="fas fa-user"></i>
                        用户名
                    </label>
                    <input type="text" id="username" name="username" placeholder="请输入用户名" required>
                </div>
                
                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i>
                        密码
                    </label>
                    <div class="password-input">
                        <input type="password" id="password" name="password" placeholder="请输入密码" required>
                        <button type="button" class="toggle-password" onclick="togglePassword('password')">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe">
                        <span>记住我</span>
                    </label>
                    <a href="#" class="forgot-password">忘记密码？</a>
                </div>
                
                <button type="submit" class="auth-btn">
                    <i class="fas fa-sign-in-alt"></i>
                    登录
                </button>
            </form>
            
            <div class="auth-footer">
                <p>还没有账号？<a href="register.html">立即注册</a></p>
            </div>
        </div>
        
        <div class="auth-features">
            <div class="feature-item">
                <i class="fas fa-fingerprint"></i>
                <span>多种打卡方式</span>
            </div>
            <div class="feature-item">
                <i class="fas fa-chart-line"></i>
                <span>智能统计分析</span>
            </div>
            <div class="feature-item">
                <i class="fas fa-mobile-alt"></i>
                <span>随时随地打卡</span>
            </div>
        </div>
    </div>
    
    <script>
        // 切换密码显示
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const icon = event.currentTarget.querySelector('i');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }
        
        // 登录表单提交
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            
            // 模拟登录验证
            const users = JSON.parse(localStorage.getItem('attendance_users') || '[]');
            const user = users.find(u => u.username === username && u.password === password);
            
            if (user || (username === 'admin' && password === 'admin123')) {
                // 登录成功
                const currentUser = user || { 
                    id: 'admin', 
                    username: 'admin', 
                    name: '管理员', 
                    role: 'admin',
                    department: '管理部'
                };
                
                localStorage.setItem('attendance_current_user', JSON.stringify(currentUser));
                
                if (rememberMe) {
                    localStorage.setItem('attendance_remember_user', username);
                } else {
                    localStorage.removeItem('attendance_remember_user');
                }
                
                showMessage('登录成功！', 'success');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);
            } else {
                showMessage('用户名或密码错误！', 'error');
            }
        });
        
        // 页面加载时检查是否记住用户名
        document.addEventListener('DOMContentLoaded', function() {
            const rememberedUser = localStorage.getItem('attendance_remember_user');
            if (rememberedUser) {
                document.getElementById('username').value = rememberedUser;
                document.getElementById('rememberMe').checked = true;
            }
        });
        
        // 显示消息提示
        function showMessage(message, type) {
            const existingMessage = document.querySelector('.message-toast');
            if (existingMessage) {
                existingMessage.remove();
            }
            
            const toast = document.createElement('div');
            toast.className = `message-toast ${type}`;
            toast.innerHTML = `
                <i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i>
                <span>${message}</span>
            `;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.add('show');
            }, 10);
            
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
    </script>
</body>
</html>
