server:
  port: 8082
  servlet:
    context-path: /api

spring:
  application:
    name: kaoqin-backend

  datasource:
    url: jdbc:sqlite:${user.dir}/kaoqin.db
    driver-class-name: org.sqlite.JDBC

  jpa:
    database-platform: com.kaoqin.config.SQLiteDialect
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

jwt:
  secret: kaoqinSecretKey2024ForAttendanceManagementSystemJWTTokenGeneration
  expiration: 86400000

cors:
  allowed-origins: "*"
  allowed-methods: "*"
  allowed-headers: "*"
  max-age: 3600
