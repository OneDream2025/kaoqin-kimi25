<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户注册 - 考勤管理系统</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="fas fa-clock"></i>
                </div>
                <h1>创建账户</h1>
                <p>加入考勤管理系统，开启高效办公</p>
            </div>

            <form class="auth-form" id="registerForm">
                <div class="form-row">
                    <div class="form-group">
                        <label>姓名 <span class="required">*</span></label>
                        <div class="input-with-icon">
                            <i class="fas fa-id-card"></i>
                            <input type="text" class="form-control" id="regName" placeholder="请输入真实姓名" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>用户名 <span class="required">*</span></label>
                        <div class="input-with-icon">
                            <i class="fas fa-user"></i>
                            <input type="text" class="form-control" id="regUsername" placeholder="请输入用户名" required>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>邮箱 <span class="required">*</span></label>
                    <div class="input-with-icon">
                        <i class="fas fa-envelope"></i>
                        <input type="email" class="form-control" id="regEmail" placeholder="请输入邮箱地址" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>密码 <span class="required">*</span></label>
                        <div class="input-with-icon">
                            <i class="fas fa-lock"></i>
                            <input type="password" class="form-control" id="regPassword" placeholder="至少6位密码" required>
                            <button type="button" class="toggle-password" onclick="togglePassword('regPassword', this)">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>确认密码 <span class="required">*</span></label>
                        <div class="input-with-icon">
                            <i class="fas fa-lock"></i>
                            <input type="password" class="form-control" id="regConfirmPassword" placeholder="再次输入密码" required>
                            <button type="button" class="toggle-password" onclick="togglePassword('regConfirmPassword', this)">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>部门 <span class="required">*</span></label>
                        <div class="input-with-icon">
                            <i class="fas fa-building"></i>
                            <select class="form-control" id="regDepartment" required>
                                <option value="">请选择部门</option>
                                <option value="技术部">技术部</option>
                                <option value="产品部">产品部</option>
                                <option value="运营部">运营部</option>
                                <option value="市场部">市场部</option>
                                <option value="人事部">人事部</option>
                                <option value="财务部">财务部</option>
                                <option value="行政部">行政部</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>职位</label>
                        <div class="input-with-icon">
                            <i class="fas fa-briefcase"></i>
                            <input type="text" class="form-control" id="regPosition" placeholder="请输入职位">
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>手机号</label>
                    <div class="input-with-icon">
                        <i class="fas fa-phone"></i>
                        <input type="tel" class="form-control" id="regPhone" placeholder="请输入手机号码">
                    </div>
                </div>

                <div class="form-group">
                    <label class="checkbox-wrapper">
                        <input type="checkbox" id="agreeTerms" required>
                        <span>我已阅读并同意 <a href="#">用户协议</a> 和 <a href="#">隐私政策</a></span>
                    </label>
                </div>

                <button type="submit" class="btn-primary btn-full">
                    <i class="fas fa-user-plus"></i>
                    注册
                </button>
            </form>

            <div class="auth-footer">
                <p>已有账户？ <a href="login.html">立即登录</a></p>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
