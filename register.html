<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 考勤管理系统</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="fas fa-clock"></i>
                </div>
                <h1>注册账号</h1>
                <p>创建您的考勤管理账号</p>
            </div>
            
            <form class="auth-form" id="registerForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="regUsername">
                            <i class="fas fa-user"></i>
                            用户名
                        </label>
                        <input type="text" id="regUsername" name="username" placeholder="请输入用户名" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="regName">
                            <i class="fas fa-id-card"></i>
                            真实姓名
                        </label>
                        <input type="text" id="regName" name="name" placeholder="请输入真实姓名" required>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="regDepartment">
                            <i class="fas fa-building"></i>
                            部门
                        </label>
                        <select id="regDepartment" name="department" required>
                            <option value="">请选择部门</option>
                            <option value="技术部">技术部</option>
                            <option value="产品部">产品部</option>
                            <option value="市场部">市场部</option>
                            <option value="销售部">销售部</option>
                            <option value="人事部">人事部</option>
                            <option value="财务部">财务部</option>
                            <option value="运营部">运营部</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="regPosition">
                            <i class="fas fa-briefcase"></i>
                            职位
                        </label>
                        <input type="text" id="regPosition" name="position" placeholder="请输入职位" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="regEmail">
                        <i class="fas fa-envelope"></i>
                        邮箱
                    </label>
                    <input type="email" id="regEmail" name="email" placeholder="请输入邮箱地址" required>
                </div>
                
                <div class="form-group">
                    <label for="regPhone">
                        <i class="fas fa-phone"></i>
                        手机号
                    </label>
                    <input type="tel" id="regPhone" name="phone" placeholder="请输入手机号" required>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="regPassword">
                            <i class="fas fa-lock"></i>
                            密码
                        </label>
                        <div class="password-input">
                            <input type="password" id="regPassword" name="password" placeholder="请输入密码（至少6位）" required minlength="6">
                            <button type="button" class="toggle-password" onclick="togglePassword('regPassword')">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="regConfirmPassword">
                            <i class="fas fa-lock"></i>
                            确认密码
                        </label>
                        <div class="password-input">
                            <input type="password" id="regConfirmPassword" name="confirmPassword" placeholder="请再次输入密码" required>
                            <button type="button" class="toggle-password" onclick="togglePassword('regConfirmPassword')">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="agreement">
                        <input type="checkbox" id="agreement" required>
                        <span>我已阅读并同意<a href="#">服务条款</a>和<a href="#">隐私政策</a></span>
                    </label>
                </div>
                
                <button type="submit" class="auth-btn">
                    <i class="fas fa-user-plus"></i>
                    注册
                </button>
            </form>
            
            <div class="auth-footer">
                <p>已有账号？<a href="login.html">立即登录</a></p>
            </div>
        </div>
        
        <div class="auth-features">
            <div class="feature-item">
                <i class="fas fa-shield-alt"></i>
                <span>安全可靠</span>
            </div>
            <div class="feature-item">
                <i class="fas fa-bolt"></i>
                <span>快速便捷</span>
            </div>
            <div class="feature-item">
                <i class="fas fa-headset"></i>
                <span>专业支持</span>
            </div>
        </div>
    </div>
    
    <script>
        // 切换密码显示
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const icon = event.currentTarget.querySelector('i');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }
        
        // 注册表单提交
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('regUsername').value.trim();
            const name = document.getElementById('regName').value.trim();
            const department = document.getElementById('regDepartment').value;
            const position = document.getElementById('regPosition').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;
            
            // 验证密码
            if (password !== confirmPassword) {
                showMessage('两次输入的密码不一致！', 'error');
                return;
            }
            
            if (password.length < 6) {
                showMessage('密码长度至少为6位！', 'error');
                return;
            }
            
            // 验证手机号
            const phoneRegex = /^1[3-9]\d{9}$/;
            if (!phoneRegex.test(phone)) {
                showMessage('请输入正确的手机号！', 'error');
                return;
            }
            
            // 验证邮箱
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showMessage('请输入正确的邮箱地址！', 'error');
                return;
            }
            
            // 检查用户名是否已存在
            const users = JSON.parse(localStorage.getItem('attendance_users') || '[]');
            if (users.find(u => u.username === username)) {
                showMessage('用户名已存在！', 'error');
                return;
            }
            
            // 创建新用户
            const newUser = {
                id: 'user_' + Date.now(),
                username: username,
                name: name,
                department: department,
                position: position,
                email: email,
                phone: phone,
                password: password,
                role: 'employee',
                status: 'active',
                createTime: new Date().toISOString(),
                avatar: null
            };
            
            users.push(newUser);
            localStorage.setItem('attendance_users', JSON.stringify(users));
            
            showMessage('注册成功！即将跳转到登录页面...', 'success');
            
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 1500);
        });
        
        // 显示消息提示
        function showMessage(message, type) {
            const existingMessage = document.querySelector('.message-toast');
            if (existingMessage) {
                existingMessage.remove();
            }
            
            const toast = document.createElement('div');
            toast.className = `message-toast ${type}`;
            toast.innerHTML = `
                <i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i>
                <span>${message}</span>
            `;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.add('show');
            }, 10);
            
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
    </script>
</body>
</html>
